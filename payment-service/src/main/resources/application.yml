server:
  port: ${PAYMENT_SERVER_PORT}

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: ${PAYMENT_DB_DRIVER_CLASS_NAME}
  jpa:
    hibernate:
      ddl-auto: ${PAYMENT_JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: ${PAYMENT_JPA_FORMAT_SQL}
    open-in-view: ${PAYMENT_JPA_OPEN_IN_VIEW}
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST}
      port: ${PAYMENT_REDIS_PORT}
  kafka:
    bootstrap-servers: ${PAYMENT_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: ${PAYMENT_KAFKA_KEY_SERIALIZER}
      value-serializer: ${PAYMENT_KAFKA_VALUE_SERIALIZER}

security:
  jwt:
    secret: ${PAYMENT_JWT_SECRET}
    expiration-minutes: ${PAYMENT_JWT_EXPIRATION_MINUTES}
    issuer: ${PAYMENT_JWT_ISSUER}

management:
  endpoints:
    web:
      exposure:
        include: ${PAYMENT_MANAGEMENT_ENDPOINTS}

logging:
  level:
    root: ${PAYMENT_LOG_LEVEL_ROOT}
    com.payplatform.payment: ${PAYMENT_LOG_LEVEL_APP}
    org.springframework.web: ${PAYMENT_LOG_LEVEL_WEB}
    org.hibernate.SQL: ${PAYMENT_LOG_LEVEL_SQL}
server:
  port: ${LEDGER_SERVER_PORT}

spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL}
    username: ${LEDGER_DB_USERNAME}
    password: ${LEDGER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${LEDGER_JPA_DDL_AUTO}
    open-in-view: ${LEDGER_JPA_OPEN_IN_VIEW}
  kafka:
    bootstrap-servers: ${LEDGER_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${LEDGER_KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: ${LEDGER_KAFKA_AUTO_OFFSET_RESET}
      key-deserializer: ${LEDGER_KAFKA_KEY_DESERIALIZER}
      value-deserializer: ${LEDGER_KAFKA_VALUE_DESERIALIZER}
      properties:
        spring.json.trusted.packages: ${LEDGER_KAFKA_TRUSTED_PACKAGES}

security:
  jwt:
    secret: ${LEDGER_JWT_SECRET}
    expiration-minutes: ${LEDGER_JWT_EXPIRATION_MINUTES}
    issuer: ${LEDGER_JWT_ISSUER}
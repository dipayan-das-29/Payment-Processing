server:
  port: 8082

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5432/db_payments_processing_portfolio
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.payplatform.events

security:
  jwt:
    secret: cGF5cGxhdGZvcm1wYXltZW50c2VjcmV0a2V5MTIzNDU2Nzg5MA==
    expiration-minutes: 60
    issuer: payplatform

server:
  port: ${AUTH_SERVER_PORT}

spring:
  application:
    name: auth-service

management:
  endpoints:
    web:
      exposure:
        include: ${AUTH_MANAGEMENT_ENDPOINTS}

security:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration-minutes: ${AUTH_JWT_EXPIRATION_MINUTES}
    issuer: ${AUTH_JWT_ISSUER}
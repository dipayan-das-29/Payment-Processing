server:
  port: ${FRAUD_SERVER_PORT}

spring:
  application:
    name: fraud-detection-service
  data:
    redis:
      host: ${FRAUD_REDIS_HOST}
      port: ${FRAUD_REDIS_PORT}
  kafka:
    bootstrap-servers: ${FRAUD_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${FRAUD_KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: ${FRAUD_KAFKA_AUTO_OFFSET_RESET}
      key-deserializer: ${FRAUD_KAFKA_KEY_DESERIALIZER}
      value-deserializer: ${FRAUD_KAFKA_VALUE_DESERIALIZER}
      properties:
        spring.json.trusted.packages: ${FRAUD_KAFKA_TRUSTED_PACKAGES}

security:
  jwt:
    secret: ${FRAUD_JWT_SECRET}
    expiration-minutes: ${FRAUD_JWT_EXPIRATION_MINUTES}
    issuer: ${FRAUD_JWT_ISSUER}
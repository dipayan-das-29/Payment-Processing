server:
  port: ${NOTIFICATION_SERVER_PORT}

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${NOTIFICATION_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: ${NOTIFICATION_KAFKA_AUTO_OFFSET_RESET}
      key-deserializer: ${NOTIFICATION_KAFKA_KEY_DESERIALIZER}
      value-deserializer: ${NOTIFICATION_KAFKA_VALUE_DESERIALIZER}
      properties:
        spring.json.trusted.packages: ${NOTIFICATION_KAFKA_TRUSTED_PACKAGES}
  mail:
    host: ${NOTIFICATION_MAIL_HOST}
    port: ${NOTIFICATION_MAIL_PORT}
    username: ${NOTIFICATION_MAIL_USERNAME}
    password: ${NOTIFICATION_MAIL_PASSWORD}

security:
  jwt:
    secret: ${NOTIFICATION_JWT_SECRET}
    expiration-minutes: ${NOTIFICATION_JWT_EXPIRATION_MINUTES}
    issuer: ${NOTIFICATION_JWT_ISSUER}